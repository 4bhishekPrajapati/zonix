<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonix - Web Music Player: for Everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>

<body>
    <div class="container flex bg-black">
        <div class="left ">

            <div class="home m-1 rounded bg-grey p-1">
                <div class="logo invert"><img src="logo.svg" alt="logo"></div>
                <ul>
                    <li class="flex"><img class="invert" src="home.svg" alt="home">Home</li>
                    <li class="flex"><img class="invert" src="search.svg" alt="search">Search</li>
                </ul>
            </div>

            <div class="library m-1 rounded bg-grey p-1">
                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="playlist">
                    <p>Your Library</p>
                </div>

                <div class="songList">
                    <ul>

                    </ul>
                </div>

                <div class="footer">
                    <div><a href="#"><span>Legal</span></a></div>
                    <div><a href="#"><span>Privacy Center</span></a></div>
                    <div><a href="#"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="#"><span>Cookies</span></a></div>
                    <div><a href="#"><span>About Ads</span></a></div>
                    <div><a href="#"><span>Accessibility</span></a></div>
                </div>
            </div>


        </div>
        <div class="right bg-grey  rounded">
            <div class="header">
                <div class="nav">
                    </svg>

                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="button">
                    <button class="signup-btn">Sign up</button>
                    <button class="login-btn">Log in</button>
                </div>
            </div>
            <div class="zonixPlaylist">
                <h1>Zonix Playlists</h1>
                <div class="cardContainer">

                    <div class="card ">
                        <div class="play">
                            <img src="play-btn.svg" alt="play-btn">
                        </div>
                        <img src="cards/card1.png" alt="card1">
                        <h2>Happy Hits</h2>
                        <p>Hits to boots your mood and fill you with happiness!</p>
                    </div>


                    <div class="card ">
                        <div class="play">
                            <img src="play-btn.svg" alt="play-btn">
                        </div>
                        <img src="cards/card1.png" alt="card1">
                        <h2>Happy Hits</h2>
                        <p>Hits to boots your mood and fill you with happiness!</p>
                    </div>
                </div>
            </div>
            <div class="playbar">

                <div class="seekbar">
                    <div class="circle"></div>
                </div>
                
                <div class="songInfo">

                </div>

                    <div class="songbuttons">
                        <img src="playbar.svg/previous.svg" alt="previous">
                        <img src="playbar.svg/play.svg" alt="play">
                        <img src="playbar.svg/next.svg" alt="next">
                    </div>

                <div class="songTimer">

                </div>
            </div>
        </div>
    </div>

    <script src="gpt.js"></script>
</body>

</html>

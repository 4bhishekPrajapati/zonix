<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a11cb" />
      <stop offset="100%" stop-color="#2575fc" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="100" height="100" rx="25" fill="url(#waveGrad)" />
  
  <!-- Soundwave Bars -->
  <rect x="22" y="40" width="8" height="20" rx="4" fill="#ffffff" opacity="0.6" />
  <rect x="35" y="25" width="8" height="50" rx="4" fill="#ffffff" opacity="0.9" />
  <rect x="48" y="35" width="8" height="30" rx="4" fill="#ffffff" opacity="0.6" />
  
  <!-- Play Icon -->
  <polygon points="65,35 65,65 89,50" fill="#ffffff" />
</svg>
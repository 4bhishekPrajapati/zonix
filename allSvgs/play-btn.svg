 <svg width="42" height="42" viewBox="0 0 83 83" xmlns="http://www.w3.org/2000/svg">

                                <defs>

                                    <radialGradient id="outer" cx="50%" cy="35%">
                                        <stop offset="0%" stop-color="#ffffff" />
                                        <stop offset="100%" stop-color="#dbe8f5" />
                                    </radialGradient>

                                    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
                                        <stop offset="0%" stop-color="#5d9dff" />
                                        <stop offset="100%" stop-color="#2e6eea" />
                                    </linearGradient>

                                    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
                                        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000"
                                            flood-opacity="0.35" />
                                    </filter>

                                </defs>

                                <!-- Outer Circle -->
                                <circle cx="41.5" cy="41.5" r="41" fill="url(#outer)" filter="url(#shadow)" />

                                <!-- Inner Blue Circle -->
                                <circle cx="41.5" cy="41.5" r="33" fill="url(#blue)" />

                                <!-- Highlight -->
                                <ellipse cx="34" cy="27" rx="20" ry="10" fill="white" opacity=".18" />

                                <!-- Play Icon -->
                                <polygon points="36,29 36,54 55,41.5" fill="white" />

                            </svg>